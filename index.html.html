<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El-Sultoniy Concept – JAMB CBT Mock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;--n0:#040d26;--n1:#0a1f55;--n2:#123a8f;--g:#d9ac2f;--g2:#f4d97e;--tx:#eef3ff;--mu:#9fb2dd;--cd:rgba(14,36,92,.72);--bd:rgba(217,172,47,.35);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Georgia,'Segoe UI',system-ui,sans-serif;color:var(--tx);background:var(--n0) radial-gradient(900px 500px at 80% -10%,var(--n2),transparent),linear-gradient(180deg,var(--n1),var(--n0));background-attachment:fixed}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--bd);background:rgba(4,13,38,.7)}
header b{display:block;font-size:1.25rem;letter-spacing:.06em;color:#fff}header i{font-size:.8rem;color:var(--g2)}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.narrow{max-width:420px;margin:24px auto}
h2,h3{margin:.2em 0 .6em;color:var(--g2)}
label{display:block;margin:10px 0;font-size:.85rem;color:var(--mu)}
input,select{width:100%;padding:11px;margin-top:4px;border-radius:10px;border:1px solid var(--bd);background:rgba(4,13,38,.8);color:var(--tx);font-size:1rem}
.btn{background:linear-gradient(135deg,var(--g2),var(--g));color:#0a1230;font-weight:700;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-size:.95rem;margin:4px 4px 4px 0}
.ghost{background:transparent;color:var(--g2);border:1px solid var(--g)}.sm{padding:6px 10px;font-size:.8rem}.red{background:#b3261e;color:#fff}
.muted{color:var(--mu);font-size:.85rem}.note{background:rgba(217,172,47,.15);border:1px solid var(--g);padding:10px;border-radius:10px;color:var(--g2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:rgba(4,13,38,.6);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center}.stat b{display:block;font-size:1.7rem;color:var(--g2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{display:flex;align-items:center;gap:6px;margin:0;border:1px solid var(--bd);border-radius:999px;padding:7px 12px;color:var(--tx)}.chip input{width:auto;margin:0}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--g2)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tabs .on{background:var(--g);color:#0a1230}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:12px;border:1px solid var(--bd);background:rgba(4,13,38,.6);color:var(--tx);font-size:1rem;cursor:pointer}.opt.sel{background:var(--g);color:#0a1230;font-weight:700}
.pal{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.pal button{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer}.pal .done{background:var(--n2)}.pal .cur{outline:2px solid var(--g2)}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--n0);padding:10px 14px;border:1px solid var(--bd);border-radius:12px;margin-bottom:12px}#tm{font-size:1.4rem;color:var(--g2);font-weight:700}
footer{text-align:center;padding:20px;color:var(--mu);font-size:.8rem}footer a{color:var(--g2)}a{color:var(--g2)}
.hero{text-align:center;padding:10px 0 4px}.hero img{width:min(340px,80%);border-radius:50%;box-shadow:0 0 0 4px var(--g),0 18px 50px rgba(217,172,47,.35)}
.ribbon{display:inline-block;margin:18px 0 6px;padding:10px 28px;background:linear-gradient(135deg,var(--g2),var(--g));color:#0a1230;font-weight:800;font-size:1.3rem;letter-spacing:.05em;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}.feat div{background:rgba(4,13,38,.6);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:.85rem;color:var(--g2)}.feat span{display:block;font-size:1.6rem}
</style></head><body>

const SB_URL='PASTE_YOUR_SUPABASE_PROJECT_URL_HERE';

const S=['Use of English','Mathematics','Physics','Chemistry','Biology','Economics'];

let tok=null,role=null,tab='exams',ex=null,timer=null,msg='',mth='',pend=null,AD=null,D=null,ss=null,opening=false;

const persist=()=>{try{if(role)localStorage.setItem('ec',JSON.stringify({tok,role,ss}));else localStorage.removeItem('ec')}catch(e){}};
const clearAuth=()=>{tok=null;role=null;ss=null;persist()},adminIn=t=>{tok=t;role='a';ss=null;persist()},candIn=s=>{ss={jwt:s.access_token,rt:s.refresh_token,exp:Date.now()+(s.expires_in||3600)*1000};role='c';tok=null;persist()};
const chk=()=>{if(SB_URL.startsWith('PASTE'))throw new Error('Not connected yet: add your Supabase Project URL at the top of the code.')};
async function au(path,body,method='POST',bearer){chk();const r=await fetch(SB_URL+'/auth/v1/'+path,{method,headers:{'Content-Type':'application/json',apikey:SB_KEY,...(bearer?{Authorization:'Bearer '+bearer}:{})},body:JSON.stringify(body)}).catch(()=>{throw new Error('Network problem. Check your internet and try again.')});
const j=await r.json().catch(()=>({}));if(!r.ok){let m=j.msg||j.error_description||j.message||'Request failed';if(/invalid login/i.test(m))m='Invalid email or password.';throw new Error(m)}return j}
async function rpc(fn,a={},jwt){chk();const h={'Content-Type':'application/json',apikey:SB_KEY};
if(jwt){if(!ss)throw new Error('Please log in again');if(ss.exp-Date.now()<60000){const s=await au('token?grant_type=refresh_token',{refresh_token:ss.rt}).catch(()=>{throw new Error('Please log in again')});candIn(s)}h.Authorization='Bearer '+ss.jwt}
const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(a)}).catch(()=>{throw new Error('Network problem. Check your internet and try again.')});
const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'Something went wrong');return j}
async function run(p,back){try{return await p()}catch(e){msg=e.message;if(/log in again/i.test(msg)){clearAuth();return home()}back()}}
const T=()=>({p_token:tok}),fmt=ms=>{const t=Math.max(0,Math.floor(ms/1000));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};

const app=h=>{$('#app').innerHTML=h;scrollTo(0,0)};
const LOGO=document.querySelector('header img').src;
const hero=()=>`<section class="hero"><img src="${LOGO}" alt="El-Sultoniy Concept 2027 UTME Online Tutorial"><div><span class="ribbon">2027 UTME · MOCK EXAMS</span></div><div class="feat"><div><span>👨‍🏫</span>Expert Tutors</div><div><span>💻</span>Flexible Learning</div><div><span>📋</span>Past Questions &amp; Practice</div><div><span>📈</span>Focused on 300+</div></div></section>`;

function home(){clearInterval(timer);ex=null;pend=null;clearAuth();
app(`${hero()}<section class="card narrow"><h2>Candidate Login</h2>${note()}<label>Email (Gmail)<input id="lc" type="email"></label><label>Password<input id="lp" type="password"></label><button class="btn" onclick="login()">Log in</button><p class="muted">New candidate? <a href="#" onclick="reg();return false">Register with your code</a></p><p class="muted"><a href="#" onclick="forgot();return false">Forgot password?</a></p></section>`)}
async function login(){await run(async()=>{const s=await au('token?grant_type=password',{email:$('#lc').value.trim().toLowerCase(),password:$('#lp').value});candIn(s);dash()},home)}
function forgot(){app(`<section class="card narrow"><h2>Reset password</h2>${note()}<p class="muted">Enter your registered Gmail. We will send you a reset link.</p><label>Email<input id="fe" type="email"></label><button class="btn" onclick="sendReset()">Send reset link</button><button class="btn ghost" onclick="home()">Back</button></section>`)}
async function sendReset(){await run(async()=>{await au('recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:$('#fe').value.trim().toLowerCase()});msg='If this email is registered, a reset link has been sent. Check your inbox and spam folder.';home()},forgot)}
function newPw(t){app(`<section class="card narrow"><h2>Set a new password</h2>${note()}<label>New password<input id="np" type="password"></label><label>Confirm password<input id="np2" type="password"></label><button class="btn" onclick="savePw('${t}')">Save new password</button></section>`)}
async function savePw(t){const p=$('#np').value;if(p.length<6||p!=$('#np2').value){msg='Passwords must match and be at least 6 characters.';return newPw(t)}
await run(async()=>{await au('user',{password:p},'PUT',t);history.replaceState(null,'',location.pathname);msg='Password updated. Please log in.';home()},()=>newPw(t))}
function reg(){const v=pend||{subs:[]};app(`<section class="card"><h2>Register</h2>${note()}<div class="grid"><label>Registration code<input id="rc" value="${esc(v.c||'')}"></label><label>Full name<input id="rn" value="${esc(v.n||'')}"></label><label>Email (Gmail)<input id="re" type="email" value="${esc(v.e||'')}"></label><label>Create password<input id="rp" type="password" value="${esc(v.p||'')}"></label></div><h3>Select your four JAMB subjects</h3><div class="chips">${S.map((s,i)=>`<label class="chip"><input type="checkbox" value="${s}" ${i==0?'checked disabled':v.subs.includes(s)?'checked':''}>${s}</label>`).join('')}</div><button class="btn" onclick="doReg()">Create account</button><button class="btn ghost" onclick="home()">Back</button></section>`)}
function doReg(){const c=$('#rc').value.trim().toUpperCase(),n=$('#rn').value.trim(),e=$('#re').value.trim().toLowerCase(),p=$('#rp').value,subs=[...document.querySelectorAll('.chip input')].filter(x=>x.checked).map(x=>x.value);
const er=!c?'Enter your registration code.':!n?'Enter your full name.':!/^\S+@\S+\.\S+$/.test(e)?'Enter a valid email address.':p.length<6?'Password must be at least 6 characters.':subs.length!=4?'Select exactly four subjects (English is compulsory).':'';
if(er){msg=er;pend={c,n,e,p,subs};return reg()}
pend={c,n,e,p,subs};app(`<section class="card narrow"><h2>Confirm your subjects</h2><p>Are you sure these are your four JAMB subjects? They cannot be changed later without the administrator.</p><div class="chips">${subs.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div><button class="btn" onclick="okReg()">Yes, create my account</button><button class="btn ghost" onclick="reg()">No, go back and re-choose</button></section>`)}
async function okReg(){await run(async()=>{
const ok=await rpc('api_check_code',{p_code:pend.c});if(!ok)throw new Error('That code is invalid or already used.');
let s;try{s=await au('signup',{email:pend.e,password:pend.p})}catch(e){if(/registered|exists/i.test(e.message))s=await au('token?grant_type=password',{email:pend.e,password:pend.p});else throw e}
if(!s.access_token)throw new Error('Account created, but email confirmation is switched on in Supabase. Ask the admin to turn it off.');
candIn(s);await rpc('api_register_profile',{p_code:pend.c,p_name:pend.n,p_subjects:pend.subs},1);pend=null;msg='Registration successful. Welcome!';dash()},reg)}
async function dash(){await run(async()=>{const d=D=await rpc('api_dashboard',{},1),st=d.stats||{},f=v=>v==null?'–':v;
app(`<section class="card"><h2>Welcome, ${esc(d.name)}</h2>${note()}<p class="muted">${(d.subjects||[]).map(esc).join(' · ')}</p><button class="btn ghost sm" onclick="home()">Log out</button></section>
<div class="grid"><div class="stat"><b>${f(st.latest_score)}/400</b>Latest score</div><div class="stat"><b>${f(st.average_score)}/400</b>Overall average</div><div class="stat"><b>${f(st.previous_score)}</b>Previous score</div><div class="stat"><b>${st.improvement==null?'–':(st.improvement>=0?'+':'')+st.improvement}</b>Improvement</div></div>
<section class="card" style="margin-top:16px"><h3>Available exams</h3>${d.exams.length?d.exams.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)"><b>${esc(x.exam_name)}</b>${x.state=='completed'?'<span class="muted">Completed</span>':`<button class="btn sm" onclick="pre(${x.exam_id})">${x.state=='in_progress'?'Resume exam':'Start exam'}</button>`}</div>`).join(''):'<p class="muted">The exam has not been opened yet. Please check back later.</p>'}</section>
<section class="card"><h3>My results</h3><div class="wrap"><table><tr><th>Exam</th><th>Score</th><th>%</th><th>Ended by</th></tr>${d.results.map(x=>`<tr><td>${esc(x.exam_name)}</td><td>${x.score}/400</td><td>${(x.score/4).toFixed(1)}%</td><td>${esc(x.reason)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No results yet.</td></tr>'}</table></div></section>`)},home)}
function pre(id){const x=D.exams.find(y=>y.exam_id==id);
app(`<section class="card"><h2>${esc(x.exam_name)}</h2><p>• ${D.per} questions from each of your 4 subjects (${D.per*4} total).<br>• Time allowed: ${D.minutes} minutes.<br>• Scored out of 400.<br>• Only one attempt per exam.</p><p class="note">Warning: if you minimise the browser or switch tabs, your exam is submitted immediately and cannot be restarted.</p><button class="btn" onclick="begin(${id})">I understand, begin</button><button class="btn ghost" onclick="dash()">Cancel</button></section>`)}
async function begin(id){await run(async()=>{const r=await rpc('api_start',{p_exam:id},1);if(r.finished){msg='Your time for this exam was over, so it was submitted.';return dash()}
ex={at:r.attempt,end:Date.now()+r.seconds_left*1000,q:r.questions,i:0,done:false};clearInterval(timer);timer=setInterval(tick,1000);draw()},dash)}
function tick(){if(!ex)return;const l=ex.end-Date.now();if(l<=0)return submit('Time up');const e=$('#tm');if(e)e.textContent=fmt(l)}
function draw(){const q=ex.q,i=ex.i,x=q[i],subs=[...new Set(q.map(y=>y.subject))];
app(`<div class="bar"><span>Question ${i+1} of ${q.length}</span><span id="tm">${fmt(ex.end-Date.now())}</span></div>
<div class="tabs">${subs.map(s=>`<button class="btn ghost sm ${s==x.subject?'on':''}" onclick="go(${q.findIndex(y=>y.subject==s)})">${esc(s)}</button>`).join('')}</div>
<section class="card"><p class="muted">${esc(x.subject)}</p><h3 style="color:var(--tx)">${esc(x.question)}</h3>${['A','B','C','D'].map(k=>`<button class="opt ${x.selected==k?'sel':''}" onclick="pick('${k}')">${k}. ${esc(x[k.toLowerCase()])}</button>`).join('')}
<button class="btn ghost" ${i?'':'disabled'} onclick="go(${i-1})">Previous</button><button class="btn" ${i<q.length-1?'':'disabled'} onclick="go(${i+1})">Next</button><button class="btn red" onclick="if(confirm('Submit your exam now?'))submit('Submitted')">Submit</button>
<div class="pal">${q.map((y,k)=>`<button class="${y.selected?'done':''} ${k==i?'cur':''}" onclick="go(${k})">${k+1}</button>`).join('')}</div></section>`)}
const go=k=>{ex.i=k;draw()};
function pick(k){const x=ex.q[ex.i];x.selected=k;draw();rpc('api_save',{p_attempt:ex.at,p_position:x.position,p_answer:k},1).catch(()=>{})}
async function submit(reason){if(!ex||ex.done)return;ex.done=true;clearInterval(timer);const at=ex.at;
await run(async()=>{const r=await rpc('api_submit',{p_attempt:at,p_reason:reason},1);ex=null;
app(`<section class="card narrow" style="text-align:center"><h2>Exam complete</h2><div class="stat"><b>${r.score}/400</b>${(r.score/4).toFixed(1)}%</div><table>${Object.entries(r.subjects||{}).map(([s,v])=>`<tr><td>${esc(s)}</td><td>${v[0]}/${v[1]}</td><td>${v[1]?(v[0]/v[1]*100).toFixed(0):0}</td></tr>`).join('')}</table><p class="muted">Ended by: ${esc(reason)}</p><button class="btn" onclick="dash()">Back to dashboard</button></section>`)},dash)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ex&&!ex.done)submit('Left exam page')});

/* ---------- Admin ---------- */
function adminLogin(){clearInterval(timer);ex=null;app(`<section class="card narrow"><h2>Admin Login</h2>${note()}<label>Email<input id="ae" type="email"></label><label>Password<input id="ap" type="password"></label><button class="btn" onclick="adminGo()">Log in</button><button class="btn ghost" onclick="home()">Back</button></section>`)}
async function adminGo(){await run(async()=>{const r=await rpc('api_admin_login',{p_email:$('#ae').value.trim(),p_password:$('#ap').value});adminIn(r.token);admin()},adminLogin)}
async function admin(){await run(async()=>{AD=await rpc('api_admin_data',T());drawA()},adminLogin)}
async function act(fn,a,m){await run(async()=>{await rpc(fn,{...T(),...a});msg=m||'';admin()},admin)}
function drawA(){const Tb=['exams','codes','questions','rankings','settings'],body={exams:aExams,codes:aCodes,questions:aQs,rankings:aRank,settings:aSet}[tab]();
app(`<section class="card"><h2>Admin Panel</h2>${note()}<div class="tabs">${Tb.map(t=>`<button class="btn ghost sm ${t==tab?'on':''}" onclick="tab='${t}';drawA()">${t}</button>`).join('')}<button class="btn sm red" onclick="home()">Exit</button></div>${body}</section>`)}
function aExams(){const tq=AD.qcounts.reduce((s,x)=>s+x.count,0);
return `${tq?'':'<p class="note">Upload questions first (Questions tab). You can only open an exam after questions have been uploaded.</p>'}${opening?`<div style="display:flex;gap:8px;align-items:end"><label style="flex:1">What is the name of this exam?<input id="en" placeholder="e.g. JAMB Mock 1 – November"></label><button class="btn" onclick="openEx()">Open exam</button><button class="btn ghost" onclick="opening=false;drawA()">Cancel</button></div>`:`<button class="btn" ${tq?'':'disabled'} onclick="opening=true;drawA()">Open new exam</button>`}<p class="muted">Every result is recorded under the exam name, so each exam has its own leaderboard. Candidates can only take an exam while it is Open.</p><div class="wrap"><table><tr><th>Exam</th><th>Status</th><th>Taken by</th><th></th></tr>${AD.exams.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.is_open?'Open':'Closed'}</td><td>${x.taken}</td><td><button class="btn sm ${x.is_open?'red':''}" onclick="act('api_admin_set_exam_open',{p_exam:${x.id},p_open:${!x.is_open}})">${x.is_open?'Close exam':'Reopen exam'}</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">No exams yet.</td></tr>'}</table></div>`}
function openEx(){const n=$('#en').value.trim();if(!n){msg='Enter the exam name.';return drawA()}opening=false;act('api_admin_open_exam',{p_name:n},'Exam “'+n+'” is now open to candidates.')}
function aCodes(){const u=AD.codes.filter(c=>c.code_status=='used').length;
return `<p class="muted">${AD.codes.length} codes · ${u} used · ${AD.codes.length-u} unused</p><div style="display:flex;gap:8px;align-items:end"><label style="flex:1">Generate codes (max 1,000)<input id="gn" type="number" value="50" min="1" max="1000"></label><button class="btn" onclick="act('api_admin_gen_codes',{p_n:+$('#gn').value||1},'Codes generated.')">Generate</button><button class="btn ghost" onclick="cp()">Copy unused</button></div>
<div class="wrap"><table><tr><th>Code</th><th>Candidate</th><th>Email</th><th>Code status</th><th>Access</th><th></th></tr>${AD.codes.map(c=>`<tr><td>${c.code}</td><td>${esc(c.candidate_name||'—')}</td><td>${esc(c.candidate_email||'—')}</td><td>${c.code_status}</td><td>${c.account_access||'—'}</td><td>${c.code_status=='used'?`<button class="btn sm ${c.account_access=='removed'?'':'red'}" onclick="act('api_admin_set_access',{p_code:'${c.code}',p_active:${c.account_access=='removed'}})">${c.account_access=='removed'?'Restore Access':'Remove Access'}</button>`:''}</td></tr>`).join('')}</table></div>`}
function cp(){const t=AD.codes.filter(c=>c.code_status=='unused').map(c=>c.code).join('\n');try{navigator.clipboard.writeText(t);msg='Unused codes copied.'}catch(e){msg='Copy not available here.'}drawA()}
function aQs(){return `<p class="muted">Upload .xlsx or .csv with columns: <b>Subject, Question, Option A, Option B, Option C, Option D, Correct Answer</b> (A–D). Bad rows (missing answer, duplicates) are skipped.</p>
<div class="grid"><label>Default subject (if no Subject column)<select id="ds">${S.map(s=>`<option>${s}</option>`).join('')}</select></label><label>Question file<input type="file" id="qf" accept=".xlsx,.xls,.csv" onchange="imp(this.files[0])"></label></div>
<div class="wrap"><table><tr><th>Subject</th><th>Questions</th><th></th></tr>${AD.qcounts.map(s=>`<tr><td>${esc(s.subject)}</td><td>${s.count}</td><td>${s.count?`<button class="btn sm red" onclick="if(confirm('Archive all ${esc(s.subject)} questions?'))act('api_admin_clear_subject',{p_subject:'${esc(s.subject)}'},'Archived.')">Archive</button>`:''}</td></tr>`).join('')}</table></div>`}
function imp(f){if(!f)return;if(!window.XLSX){msg='Spreadsheet reader could not load.';return drawA()}
const rd=new FileReader();rd.onload=async e=>{const wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),ds=$('#ds').value;
const out=rows.map(r=>{const g=k=>{const key=Object.keys(r).find(x=>x.toLowerCase().replace(/[^a-z]/g,'').includes(k));return key?String(r[key]).trim():''};return{subject:g('subject')||ds,question:g('question'),a:g('optiona'),b:g('optionb'),c:g('optionc'),d:g('optiond'),answer:g('correct')}});
await run(async()=>{const r=await rpc('api_admin_import',{...T(),p_rows:out});msg=`Imported ${r.imported} question(s). Skipped ${r.skipped} (missing answer, duplicate or error).`;admin()},admin)};rd.readAsArrayBuffer(f)}
function aRank(){mth=mth||(AD.exams.length?AD.exams[AD.exams.length-1].id:'');const m=AD.board.filter(x=>x.exam_id==mth).sort((a,b)=>a.position-b.position);
return `<h3>Exam leaderboard</h3><label>Exam<select onchange="mth=this.value;drawA()">${AD.exams.map(x=>`<option value="${x.id}" ${x.id==mth?'selected':''}>${esc(x.name)}</option>`).join('')||'<option>No exams yet</option>'}</select></label>
<div class="wrap"><table><tr><th>#</th><th>Candidate</th><th>Score</th><th>Ended by</th></tr>${m.map(x=>`<tr><td>${x.position}</td><td>${esc(x.full_name)}</td><td>${x.total_score}/400</td><td>${esc(x.end_reason)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No results.</td></tr>'}</table></div>
<h3>Overall (cumulative average)</h3><div class="wrap"><table><tr><th>#</th><th>Candidate</th><th>Exams</th><th>Average</th><th>%</th></tr>${AD.overall.sort((a,b)=>a.position-b.position).map(x=>`<tr><td>${x.position}</td><td>${esc(x.full_name)}</td><td>${x.mocks_completed}</td><td>${x.average_score}/400</td><td>${x.average_percent}%</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No results.</td></tr>'}</table></div>`}
function aSet(){return `<div class="grid"><label>Exam time (minutes)<input id="sm" type="number" value="${AD.settings.exam_minutes}"></label><label>Questions per subject<input id="sp" type="number" value="${AD.settings.questions_per_subject}"></label></div><button class="btn" onclick="act('api_admin_set_settings',{p_minutes:+$('#sm').value||60,p_per:+$('#sp').value||25},'Settings saved.')">Save settings</button>`}

(()=>{const q=new URLSearchParams(location.hash.slice(1));
if(q.get('type')=='recovery'&&q.get('access_token'))return newPw(q.get('access_token'));
if(q.get('error_description')){msg=q.get('error_description').replace(/\+/g,' ');history.replaceState(null,'',location.pathname);return forgot()}
if(role=='c'&&ss)dash();else if(role=='a'&&tok)admin();else home()})();
</script></body></html>
